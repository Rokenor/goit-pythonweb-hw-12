<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>Підтвердження електронної пошти</title>
</head>
<body>
<p>Вітаємо, {{ username }}!</p>
<p>Дякуємо за реєстрацію в Contacts API.</p>
<p>Щоб підтвердити свою електронну адресу, перейдіть за посиланням:</p>
<p>
    <a href="{{ host }}api/auth/confirmed_email/{{ token }}">
        Підтвердити електронну пошту
    </a>
</p>
<p>Посилання дійсне 7 днів. Якщо ви не реєструвалися — просто проігноруйте цей лист.</p>
<p>З повагою,<br>команда Contacts API</p>
</body>
</html>
