[tool.poetry]
name = "goit-pythonweb-hw-12"
version = "0.3.0"
description = "REST API for storing and managing contacts with JWT auth, Redis cache and role-based access (FastAPI + SQLAlchemy + PostgreSQL)"
authors = ["Oleksandr Kovrizhnykh <oleksandr.kovrizhnykh@amo.tech>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.6" }
sqlalchemy = "^2.0.35"
alembic = "^1.13.2"
asyncpg = "^0.29.0"
greenlet = "^3.1.0"
pydantic = { extras = ["email"], version = "^2.9.2" }
pydantic-settings = "^2.5.2"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "~4.0.1"
python-multipart = "^0.0.12"
fastapi-mail = "^1.4.1"
libgravatar = "^1.0.4"
cloudinary = "^1.41.0"
slowapi = "^0.1.9"
redis = "^5.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
aiosqlite = "^0.20.0"
httpx = "^0.27.2"
sphinx = "^8.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:jose.*",
    "ignore::DeprecationWarning:passlib.*",
]

[tool.coverage.run]
core = "sysmon"
source = ["src", "main"]
omit = ["*/__pycache__/*", "*/templates/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
